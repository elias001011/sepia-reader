<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Sépia — biblioteca, editor Markdown e modo leitura sem distrações.">
  <meta name="theme-color" content="#2B211D">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Sépia">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Sépia</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /*
      Without this, dragging down at the top of the library hands the gesture
      to the browser's own pull-to-refresh, which reloads the whole PWA —
      the app's RefreshIndicator (force sync) never gets to run. `contain`
      keeps the overscroll inside the Flutter view so the in-app spinner
      shows and syncing happens without a page reload.
    */
    html, body { margin: 0; height: 100%; overscroll-behavior-y: contain; }
  </style>
</head>
<body style="margin:0;background:#2B211D">
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
