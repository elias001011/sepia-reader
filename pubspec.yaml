name: sepia_reader
description: "Sépia — uma biblioteca e editor de Markdown para leitura sem distrações."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 2.2.6+23

environment:
  sdk: ^3.13.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  file_picker: ^12.0.0
  flutter_markdown_plus: ^1.0.12
  highlight: ^0.7.0
  http: ^1.2.0
  shared_preferences: ^2.5.5
  uuid: ^4.6.0
  web: ^1.1.1
  scrollable_positioned_list: ^0.3.8
  flutter_tts: ^4.2.5
  markdown: ^7.3.1
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.2
  device_info_plus: ^13.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/sepia_icon.png
    - assets/fonts/licenses/

  # Reading faces are bundled (Sépia works fully offline). Inter, Merriweather
  # and Roboto Mono are the upstream Google Fonts static files; the families
  # added later are Latin subsets of the same source, instanced to static
  # weights to keep the download small.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
        - asset: assets/fonts/Inter-Italic.ttf
          style: italic
    # Merriweather exactly as it shipped in every prior release — the
    # upstream static files, untouched. This is the default.
    - family: Merriweather
      fonts:
        - asset: assets/fonts/Merriweather-400.ttf
          weight: 400
        - asset: assets/fonts/Merriweather-400-Italic.ttf
          style: italic
          weight: 400
        - asset: assets/fonts/Merriweather-700.ttf
          weight: 700
        - asset: assets/fonts/Merriweather-800.ttf
          weight: 800
    # The older 2017 cut (Merriweather v2.002) — warmer, a touch more
    # idiosyncratic — kept as a pick for anyone who prefers it. Latin subset.
    - family: Merriweather (2017)
      fonts:
        - asset: assets/fonts/Merriweather2017-400.ttf
          weight: 400
        - asset: assets/fonts/Merriweather2017-400-Italic.ttf
          style: italic
          weight: 400
        - asset: assets/fonts/Merriweather2017-700.ttf
          weight: 700
        - asset: assets/fonts/Merriweather2017-700-Italic.ttf
          style: italic
          weight: 700
        - asset: assets/fonts/Merriweather2017-900.ttf
          weight: 900
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader-400.ttf
          weight: 400
        - asset: assets/fonts/Newsreader-400-Italic.ttf
          style: italic
          weight: 400
        - asset: assets/fonts/Newsreader-700.ttf
          weight: 700
    - family: Merriweather Sans
      fonts:
        - asset: assets/fonts/MerriweatherSans-400.ttf
          weight: 400
        - asset: assets/fonts/MerriweatherSans-400-Italic.ttf
          style: italic
          weight: 400
        - asset: assets/fonts/MerriweatherSans-700.ttf
          weight: 700
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-400.ttf
          weight: 400
        - asset: assets/fonts/Lora-400-Italic.ttf
          style: italic
          weight: 400
        - asset: assets/fonts/Lora-700.ttf
          weight: 700
    - family: Bitter
      fonts:
        - asset: assets/fonts/Bitter-400.ttf
          weight: 400
        - asset: assets/fonts/Bitter-400-Italic.ttf
          style: italic
          weight: 400
        - asset: assets/fonts/Bitter-700.ttf
          weight: 700
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata-400.ttf
          weight: 400
        - asset: assets/fonts/Literata-400-Italic.ttf
          style: italic
          weight: 400
        - asset: assets/fonts/Literata-700.ttf
          weight: 700
    - family: Source Serif 4
      fonts:
        - asset: assets/fonts/SourceSerif4-400.ttf
          weight: 400
        - asset: assets/fonts/SourceSerif4-400-Italic.ttf
          style: italic
          weight: 400
        - asset: assets/fonts/SourceSerif4-700.ttf
          weight: 700
    - family: EB Garamond
      fonts:
        - asset: assets/fonts/EBGaramond-400.ttf
          weight: 400
        - asset: assets/fonts/EBGaramond-400-Italic.ttf
          style: italic
          weight: 400
        - asset: assets/fonts/EBGaramond-700.ttf
          weight: 700
    - family: Atkinson Hyperlegible
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegible-400.ttf
          weight: 400
        - asset: assets/fonts/AtkinsonHyperlegible-400-Italic.ttf
          style: italic
          weight: 400
        - asset: assets/fonts/AtkinsonHyperlegible-700.ttf
          weight: 700
    - family: Roboto Mono
      fonts:
        - asset: assets/fonts/RobotoMono.ttf
        - asset: assets/fonts/RobotoMono-Italic.ttf
          style: italic
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-400.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-400-Italic.ttf
          style: italic
          weight: 400
        - asset: assets/fonts/JetBrainsMono-700.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/sepia_icon.png
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/sepia_icon.png
    background_color: "#2B211D"
    theme_color: "#9A6B45"

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
