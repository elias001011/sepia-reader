# Configuração de análise estática do Sépia.
#
# Os critérios de revisão do projeto exigem `flutter analyze` sem erros nem
# avisos não justificados, `dart format` aplicado e as regras abaixo ligadas.

include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    unused_import: error
    dead_code: error
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - cancel_subscriptions
    - prefer_const_constructors
