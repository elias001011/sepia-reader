name: App

on:
  push:
    branches: [app]
  pull_request:
    branches: [app]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build universal and ARM64 APKs
        run: |
          mkdir -p build/app-artifacts
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk build/app-artifacts/sepia-android-universal.apk
          flutter build apk --release --target-platform android-arm64
          cp build/app/outputs/flutter-apk/app-release.apk build/app-artifacts/sepia-android-arm64-v8a.apk
      - uses: actions/upload-artifact@v7
        with:
          name: sepia-android
          path: build/app-artifacts/*.apk
