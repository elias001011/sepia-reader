name: Recover 2.6.0 release

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify original release build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=43918510875
          run_sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq .head_sha)"
          tag_sha="$(git rev-parse 'v2.6.0^{commit}')"
          [[ "$run_sha" == "$tag_sha" ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs" --jq '.jobs[] | select(.name == "release") | .steps[] | select(.name == "Package release files" or .name == "Run actions/upload-artifact@v7") | .conclusion' > /tmp/steps
          [[ "$(grep -cx success /tmp/steps)" == 2 ]]
      - uses: actions/download-artifact@v4
        with:
          name: sepia-v2.6.0
          path: dist
          run-id: 43918510875
          github-token: ${{ github.token }}
      - name: Verify and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check SHA256SUMS.txt)
          test -s docs/RELEASE-2.6.0.md
          gh release create v2.6.0 dist/sepia-*.apk dist/sepia-*-web.tar.gz \
            dist/sepia-*-linux-x64.tar.gz dist/sepia-*-tts-server.tar.gz \
            dist/sepia-*-server.py dist/sepia-*-cli.py dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --title 'Sépia v2.6.0' \
            --notes-file docs/RELEASE-2.6.0.md --verify-tag
