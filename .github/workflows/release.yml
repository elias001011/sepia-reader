name: Release

on:
  push:
    tags:
      - "v*.*.*"
    # GitHub Apps do not expose tag creation in every client. A protected
    # release branch at main's exact HEAD lets this workflow create the tag
    # after every validation succeeds, then publish in the same run.
    branches:
      - "release/v*.*.*"
  # GitHub Apps may suppress workflows for refs they create. Opening a
  # `Release vX.Y.Z` issue as the repository owner is the equivalent audited
  # trigger and runs this workflow from the default branch's exact HEAD.
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.event_name != 'issues' ||
      (github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, 'Release v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the Lite branch can be checked out into a worktree
          # and built from the same tag.
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Resolve and verify release ref
        shell: bash
        env:
          RELEASE_ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_EVENT_NAME" == issues ]]; then
            RELEASE_TAG="${RELEASE_ISSUE_TITLE#Release }"
          else
            RELEASE_TAG="${GITHUB_REF_NAME#release/}"
          fi
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
            if [[ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]]; then
              echo "::error::Release trigger must run at main's exact HEAD."
              exit 1
            fi
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release tag: $RELEASE_TAG"
            exit 1
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Verify tag and package version
        shell: bash
        run: |
          TAG_VERSION="${RELEASE_TAG#v}"
          APP_VERSION="$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)"
          if [[ "$TAG_VERSION" != "$APP_VERSION" ]]; then
            echo "Tag version $TAG_VERSION does not match pubspec version $APP_VERSION."
            exit 1
          fi

      - name: Verify the original Merriweather files
        shell: bash
        run: |
          sha256sum --check <<'EOF'
          ba165b856ee8fa316cd0f87210df065aeb5bc94f5563872f5a0a9d9949a23d47  assets/fonts/Merriweather-400.ttf
          f4dc499a1b051e49fd0f5dd1c347dacd91e3de2b2f84a902f1d550fe2f92a473  assets/fonts/Merriweather-400-Italic.ttf
          2c90fecddc38cacb6142cb85a26b727547af69912f4344ccf50edcf51577a52a  assets/fonts/Merriweather-700.ttf
          f6743d70cabd70be9754acd4f62074b3ec05c3d007b316e58ef8e2ddcacefd57  assets/fonts/Merriweather-800.ttf
          EOF

      - name: Restore Android signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo '::warning::No KEYSTORE_BASE64 secret — APKs will be signed with debug key'
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=release-keystore.jks
          EOF

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: python3 -m unittest discover -s server -p 'test_*.py'
      # Per-ABI APKs, not just a universal one. With the on-device speech
      # models in the build, a universal APK carries the native inference
      # libraries for every architecture at once while any given phone can
      # use exactly one of them. Splitting means an arm64 device — which is
      # very nearly all of them — downloads only its own.
      - name: Build Android APKs (per ABI and universal)
        shell: bash
        run: |
          mkdir -p build/release-apks
          flutter build apk --release --split-per-abi
          for abi in arm64-v8a armeabi-v7a x86_64; do
            src="build/app/outputs/flutter-apk/app-${abi}-release.apk"
            if [[ -f "$src" ]]; then
              cp "$src" "build/release-apks/${abi}.apk"
            else
              echo "::warning::no APK produced for $abi"
            fi
          done
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk build/release-apks/universal.apk
          ls -lh build/release-apks

      # The Lite branch is the same reader with only the on-device neural-TTS
      # stack removed. It deliberately keeps the bundled reading fonts and
      # every other feature. It ships from this same tag, built from its own
      # branch in a worktree so the two never share a build directory.
      - name: Build Sépia Lite APKs
        shell: bash
        run: |
          git fetch --no-tags origin "+refs/heads/Lite:refs/remotes/origin/Lite"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/Lite; then
            echo "::error::Lite does not contain tagged commit $GITHUB_SHA — rebase Lite onto main before tagging."
            exit 1
          fi
          git worktree add ../sepia-lite origin/Lite
          # Carry the signing material over so Lite is signed exactly like the
          # main app — an unnoticed fallback to the debug key would make the
          # Lite APK uninstallable as an upgrade. If main had a keystore, Lite
          # must get it too; failure here fails the release.
          if [ -f android/key.properties ]; then
            cp android/app/release-keystore.jks ../sepia-lite/android/app/
            cp android/key.properties ../sepia-lite/android/
          fi
          cd ../sepia-lite
          # The Lite branch is built from its own tip, not from this tag, so
          # its version can silently drift. Refuse to ship a mismatch.
          LITE_VERSION="$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)"
          if [[ "$LITE_VERSION" != "${RELEASE_TAG#v}" ]]; then
            echo "::error::Lite pubspec is $LITE_VERSION but the tag is ${RELEASE_TAG#v} — merge main into Lite before releasing."
            exit 1
          fi
          flutter pub get
          flutter analyze
          flutter test
          mkdir -p build/lite-apks
          flutter build apk --release --split-per-abi
          for abi in arm64-v8a armeabi-v7a x86_64; do
            src="build/app/outputs/flutter-apk/app-${abi}-release.apk"
            [[ -f "$src" ]] && cp "$src" "build/lite-apks/${abi}.apk" || echo "::warning::no Lite APK for $abi"
          done
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk build/lite-apks/universal.apk
          ls -lh build/lite-apks

      - run: bash tool/build_web.sh

      - name: Package release files
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86_64 universal; do
            src="build/release-apks/${abi}.apk"
            [[ -f "$src" ]] && cp "$src" "dist/sepia-${VERSION}-android-${abi}.apk"
            lite="../sepia-lite/build/lite-apks/${abi}.apk"
            [[ -f "$lite" ]] && cp "$lite" "dist/sepia-lite-${VERSION}-android-${abi}.apk"
          done
          tar -C build/web -czf "dist/sepia-${VERSION}-web.tar.gz" .
          cp server/main.py "dist/sepia-${VERSION}-server.py"
          cd dist
          sha256sum sepia-*.apk "sepia-${VERSION}-web.tar.gz" "sepia-${VERSION}-server.py" > SHA256SUMS.txt
          ls -lh

      - uses: actions/upload-artifact@v7
        with:
          name: sepia-${{ env.RELEASE_TAG }}
          path: dist

      - name: Create the validated tag
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        run: |
          REMOTE_SHA="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" | cut -f1)"
          if [[ -z "$REMOTE_SHA" ]]; then
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          elif [[ "$REMOTE_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag $RELEASE_TAG already points to $REMOTE_SHA."
            exit 1
          else
            echo "Tag $RELEASE_TAG already points to this validated commit."
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$RELEASE_TAG"
          dist/sepia-*.apk
          dist/sepia-*-web.tar.gz
          dist/sepia-*-server.py
          dist/SHA256SUMS.txt
          --repo "$GITHUB_REPOSITORY"
          --title "Sépia $RELEASE_TAG"
          --generate-notes
          --verify-tag
