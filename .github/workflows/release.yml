name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Verify tag and package version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION="$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)"
          if [[ "$TAG_VERSION" != "$APP_VERSION" ]]; then
            echo "Tag version $TAG_VERSION does not match pubspec version $APP_VERSION."
            exit 1
          fi

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build universal and ARM64 Android APKs
        shell: bash
        run: |
          mkdir -p build/release-apks
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk build/release-apks/universal.apk
          flutter build apk --release --target-platform android-arm64
          cp build/app/outputs/flutter-apk/app-release.apk build/release-apks/arm64-v8a.apk
      - run: bash tool/build_web.sh

      - name: Package release files
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp build/release-apks/universal.apk "dist/sepia-${VERSION}-android-universal.apk"
          cp build/release-apks/arm64-v8a.apk "dist/sepia-${VERSION}-android-arm64-v8a.apk"
          tar -C build/web -czf "dist/sepia-${VERSION}-web.tar.gz" .
          cd dist
          sha256sum "sepia-${VERSION}-android-universal.apk" "sepia-${VERSION}-android-arm64-v8a.apk" "sepia-${VERSION}-web.tar.gz" > SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: sepia-${{ github.ref_name }}
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/sepia-*-android-universal.apk
          dist/sepia-*-android-arm64-v8a.apk
          dist/sepia-*-web.tar.gz
          dist/SHA256SUMS.txt
          --repo "$GITHUB_REPOSITORY"
          --title "Sépia $GITHUB_REF_NAME"
          --generate-notes
          --verify-tag
