name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Verify tag and package version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION="$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)"
          if [[ "$TAG_VERSION" != "$APP_VERSION" ]]; then
            echo "Tag version $TAG_VERSION does not match pubspec version $APP_VERSION."
            exit 1
          fi

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - run: flutter build web --release

      - name: Package release files
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/sepia-${VERSION}-android.apk"
          tar -C build/web -czf "dist/sepia-${VERSION}-web.tar.gz" .
          cd dist
          sha256sum "sepia-${VERSION}-android.apk" "sepia-${VERSION}-web.tar.gz" > SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: sepia-${{ github.ref_name }}
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/sepia-*-android.apk
          dist/sepia-*-web.tar.gz
          dist/SHA256SUMS.txt
          --repo "$GITHUB_REPOSITORY"
          --title "Sépia $GITHUB_REF_NAME"
          --generate-notes
          --verify-tag
